{{define "editor.html"}}{{template "base-start" .}}
<div id="app" class="flex h-screen flex-col overflow-hidden" data-id="{{.Project.ID}}" data-name="{{.Project.Name}}">
 <header class="z-40 flex h-14 shrink-0 items-center gap-2 border-b border-slate-200 bg-white px-3 shadow-sm">
  <a href="/" class="icon-btn" title="Projects">←</a><div class="mr-2 min-w-0"><h1 class="truncate text-sm font-semibold text-slate-900">{{.Project.Name}}</h1><p id="save-status" class="text-[10px] text-slate-400">Saved</p></div><div class="h-6 w-px bg-slate-200"></div>
  <button class="btn btn-primary" id="add-table">＋ Table</button><button class="icon-btn" id="undo" title="Undo">↶</button><button class="icon-btn" id="redo" title="Redo">↷</button><button class="icon-btn" id="auto-layout" title="Auto layout">▦</button>
  <div class="ml-auto flex items-center gap-1"><button class="btn hidden sm:inline-flex" id="save">Save</button><button class="btn" id="import-menu">Import ▾</button><button class="btn" id="export-menu">Export ▾</button><button class="icon-btn lg:hidden" id="toggle-inspector">☰</button></div>
 </header>
 <div class="relative flex min-h-0 flex-1">
  <aside class="editor-sidebar w-56 shrink-0 overflow-y-auto border-r border-slate-200 bg-white p-3"><div class="mb-2 flex items-center justify-between"><span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Tables</span><span id="table-count" class="rounded bg-slate-100 px-1.5 text-xs text-slate-500">0</span></div><input id="table-search" class="field mb-3" placeholder="Search tables"><div id="table-list" class="space-y-1"></div></aside>
  <main id="canvas" class="canvas-grid relative min-w-0 flex-1 cursor-grab overflow-hidden"><div id="stage" class="canvas-stage absolute left-0 top-0"><svg id="connections" class="absolute left-0 top-0 overflow-visible" width="1" height="1"></svg><div id="nodes"></div></div><div class="absolute bottom-4 left-4 flex items-center rounded-xl border border-slate-200 bg-white p-1 shadow"><button class="icon-btn" id="zoom-out">−</button><span id="zoom-label" class="w-12 text-center text-xs text-slate-500">100%</span><button class="icon-btn" id="zoom-in">＋</button><button class="icon-btn" id="zoom-fit" title="Fit">⊙</button></div></main>
  <aside class="editor-inspector w-80 shrink-0 overflow-y-auto border-l border-slate-200 bg-white" id="inspector"><div id="inspector-content" class="p-4"><div class="py-16 text-center text-sm text-slate-400">Select a table or relation<br>to edit its details.</div></div></aside>
 </div>
</div>
<div class="modal" id="io-modal"><div class="modal-card max-w-3xl"><div class="flex items-center justify-between"><h2 id="io-title" class="text-lg font-semibold">SQL</h2><button class="icon-btn" data-io-close>×</button></div><div id="io-engine-wrap" class="mt-4"><label class="label">Dialect</label><select class="field" id="io-engine"><option value="mysql">MySQL</option><option value="postgresql">PostgreSQL</option></select></div><textarea id="io-text" class="mt-4 h-80 w-full resize-none rounded-xl border border-slate-200 bg-slate-950 p-4 font-mono text-xs leading-5 text-slate-100 outline-none"></textarea><div class="mt-4 flex justify-between"><button class="btn" id="io-file">Choose file</button><div class="flex gap-2"><button class="btn" id="io-copy">Copy</button><button class="btn btn-primary" id="io-action">Download</button></div></div><input id="file-input" type="file" class="hidden" accept=".json,.sql,application/json,text/plain"></div></div>
<div id="context-menu" class="fixed z-50 hidden min-w-44 rounded-xl border border-slate-200 bg-white p-1 shadow-xl"></div><div id="toast-root" class="fixed bottom-5 right-5 z-[100] space-y-2"></div>
<script>window.INITIAL_DIAGRAM=JSON.parse({{.DiagramJS}});</script><script src="/static/js/editor.js" defer></script>
{{template "base-end" .}}{{end}}
